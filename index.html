<body>
<a class="skip" href="#main">Ir para o conteúdo</a>

<div class="shell" hidden>
  <aside class="side" id="side" aria-label="Menu principal"><div class="brand">Ovos Rossi<small>Intelligence</small></div><nav id="nav"></nav></aside>

<script>
// Formatação e conversão de embalagens. Internamente tudo é gravado em OVOS.
const CONFIG_PADRAO = { ovosPorCartela: 30, cartelasPorCaixa: 12 };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtNum = (n, d = 0) => new Intl.NumberFormat('pt-BR', { maximumFractionDigits: d, minimumFractionDigits: d }).format(n);
const fmtBRL = n => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(n);
const fmtPct = n => fmtNum(n, 1) + '%';
const fmtData = iso => iso.split('-').reverse().join('/');
const hojeBR = () => new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', dateStyle: 'full' }).format(new Date());

/** "23+4" (caixas+cartelas) -> ovos. Retorna {ok, ovos} ou {ok:false, erro}. */
function paraOvos(txt, cfg = CONFIG_PADRAO) {
  const m = /^\s*(\d+)\s*(?:\+\s*(\d+))?\s*$/.exec(String(txt));
  if (!m) return { ok: false, erro: 'Use o formato caixas+cartelas, por exemplo 23+4.' };
  const cx = +m[1], ct = +(m[2] || 0);
  if (ct >= cfg.cartelasPorCaixa) return { ok: false, erro: `Cartelas deve ser menor que ${cfg.cartelasPorCaixa}.` };
  return { ok: true, ovos: (cx * cfg.cartelasPorCaixa + ct) * cfg.ovosPorCartela };
}
/** ovos -> "23+4"; ovos soltos (fora de cartela completa) aparecem como "(+N ovos)". */
function formatarCaixas(ovos, cfg = CONFIG_PADRAO) {
  const cart = Math.floor(ovos / cfg.ovosPorCartela), solto = ovos % cfg.ovosPorCartela;
  const s = `${Math.floor(cart / cfg.cartelasPorCaixa)}+${cart % cfg.cartelasPorCaixa}`;
  return solto ? `${s} (+${solto} ovos)` : s;
}

// Regras de negócio puras (sem DOM e sem rede). Quantidades de ovos sempre em OVOS; dinheiro em reais com 2 casas.
const novoId = () => globalThis.crypto?.randomUUID?.() ?? 'id-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const r2 = n => Math.round(n * 100) / 100;
const somar = (a, f) => a.reduce((s, x) => s + f(x), 0);
const ativos = a => a.filter(x => x.status !== 'anulado');
const inteiro = (v, min = 0) => Number.isInteger(v) && v >= min;
const dataValida = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && new Date(s + 'T00:00:00Z').toISOString().slice(0, 10) === s;
const diaAnterior = s => new Date(Date.parse(s + 'T00:00:00Z') - 864e5).toISOString().slice(0, 10);

// "!" = obrigatório. Tipos: str, data, int (>=0), int+ (>=1), num+ (>0), arr (não vazio), enum:a|b
const ESQUEMAS = {
  galpao: { codigo: 'str!', nome: 'str!', capacidade: 'int+!', dataOperacao: 'data', situacao: 'enum:ativo|inativo|manutencao!', linhagem: 'str', sistema: 'str' },
  lote: { galpaoId: 'str!', linhagem: 'str!', dataAlojamento: 'data!', avesIniciais: 'int+!' },
  movAves: { loteId: 'str!', data: 'data!', tipo: 'enum:alojamento|entrada|morte|descarte|abate|saida|transf_saida|transf_entrada!', quantidade: 'int+!' },
  producao: { data: 'data!', galpaoId: 'str!', loteId: 'str!', aves: 'int+!', produzidos: 'int!', limpos: 'int!', sujos: 'int!', trincados: 'int!', descartados: 'int!', processamento: 'int!' },
  movEstoque: { produtoId: 'str!', data: 'data!', tipo: 'enum:compra|consumo|perda|ajuste_mais|ajuste_menos!', quantidade: 'int+!' },
  produtoVenda: { nome: 'str!', ovosPorUnidade: 'int+!' },
  venda: { clienteId: 'str!', data: 'data!', itens: 'arr!', status: 'enum:rascunho|confirmada|expedida|cancelada|estornada!' },
  lancamento: { tipo: 'enum:receita|despesa!', valor: 'num+!', vencimento: 'data!' }
};
function validar(nome, o) {
  const e = ESQUEMAS[nome], erros = [];
  if (!e) return ['Esquema desconhecido: ' + nome];
  for (const [c, s0] of Object.entries(e)) {
    const obrig = s0.endsWith('!'), s = s0.replace('!', ''), v = o?.[c];
    if (v === undefined || v === null || v === '') { if (obrig) erros.push(`${c}: campo obrigatório.`); continue; }
    const ruim = (s === 'str' && typeof v !== 'string') || (s === 'data' && !dataValida(v)) || (s === 'int' && !inteiro(v)) || (s === 'int+' && !inteiro(v, 1))
      || (s === 'num+' && !(typeof v === 'number' && v > 0)) || (s === 'arr' && !(Array.isArray(v) && v.length)) || (s.startsWith('enum:') && !s.slice(5).split('|').includes(v));
    if (ruim) erros.push(`${c}: valor inválido.`);
  }
  return erros;
}
const jaProcessada = (registros, opId) => !!opId && registros.some(r => r.opId === opId);

// ---- Produção e postura ----
const conciliacaoProducao = p => p.limpos + p.sujos + p.trincados + p.descartados + p.processamento - p.produzidos; // 0 = conciliado
const comercializaveis = p => p.limpos; // sujos só entram após limpeza e nova classificação
const chaveProducao = p => `${p.data}|${p.galpaoId}|${p.loteId}`;
function validarProducao(p, existentes = []) {
  const er = validar('producao', p);
  if (er.length) return er;
  if (conciliacaoProducao(p) !== 0) er.push('As categorias (limpos, sujos, trincados, descartados, processamento) devem somar exatamente os ovos produzidos.');
  if (ativos(existentes).some(x => x.id !== p.id && chaveProducao(x) === chaveProducao(p))) er.push('Já existe lançamento para esta data, galpão e lote. Edite o existente.');
  return er;
}
/** Taxa de postura (%) = Σ ovos produzidos ÷ Σ aves vivas por dia × 100. Retorna null sem dados. */
function postura(regs) {
  const aves = somar(regs, r => r.aves);
  return aves > 0 ? somar(regs, r => r.produzidos ?? r.ovos) / aves * 100 : null;
}

// ---- Plantel ----
const SAIDAS = ['morte', 'descarte', 'abate', 'saida', 'transf_saida'], ENTRADAS = ['alojamento', 'entrada', 'transf_entrada'];
const sinalAves = t => SAIDAS.includes(t) ? -1 : 1;
const saldoAves = (movs, ate = '9999-12-31') => somar(ativos(movs).filter(m => m.data <= ate), m => sinalAves(m.tipo) * m.quantidade);
function validarMovAves(movs, m) {
  const er = validar('movAves', m);
  if (er.length) return er;
  const lista = [...ativos(movs), m].sort((a, b) => a.data.localeCompare(b.data) || sinalAves(b.tipo) - sinalAves(a.tipo));
  let s = 0;
  for (const x of lista) { s += sinalAves(x.tipo) * x.quantidade; if (s < 0) return [`Saldo de aves ficaria negativo em ${x.data}. Revise a quantidade ou a data.`]; }
  return [];
}
/** Mortalidade (%) = mortes ÷ (aves no início do período + entradas no período) × 100. */
function mortalidadePct(movs, ini, fim) {
  const a = ativos(movs), noPeriodo = a.filter(m => m.data >= ini && m.data <= fim);
  const expostas = saldoAves(a, diaAnterior(ini)) + somar(noPeriodo.filter(m => ENTRADAS.includes(m.tipo)), m => m.quantidade);
  const mortes = somar(noPeriodo.filter(m => m.tipo === 'morte'), m => m.quantidade);
  return expostas > 0 ? mortes / expostas * 100 : null;
}

// ---- Estoque de insumos ----
const SINAL_EST = { compra: 1, ajuste_mais: 1, consumo: -1, perda: -1, ajuste_menos: -1 };
const saldoProduto = (movs, pid) => somar(ativos(movs).filter(m => m.produtoId === pid), m => SINAL_EST[m.tipo] * m.quantidade);
function validarMovEstoque(movs, m) {
  const er = validar('movEstoque', m);
  if (er.length) return er;
  if (jaProcessada(movs, m.opId)) return ['Operação já registrada (duplicidade evitada).'];
  if (/^(perda|ajuste_)/.test(m.tipo) && !m.justificativa) er.push('Perdas e ajustes exigem justificativa.');
  if (SINAL_EST[m.tipo] < 0 && m.quantidade > saldoProduto(movs, m.produtoId)) er.push('Estoque insuficiente para esta saída.');
  return er;
}

// ---- Vendas ----
function ovosDoItem(item, produtos) {
  const p = produtos.find(x => x.id === item.produtoId);
  if (!p) throw new Error('Produto de venda inexistente.');
  return item.quantidade * p.ovosPorUnidade;
}
const totalVenda = itens => r2(somar(itens, i => i.quantidade * i.preco - (i.desconto || 0)));
const estoqueDisponivel = (fisico, reservado) => fisico - reservado;
function confirmarVenda(venda, produtos, est, { permitirNegativo = false } = {}) {
  const er = validar('venda', venda);
  if (er.length) return { ok: false, erros: er };
  const ovos = somar(venda.itens, i => ovosDoItem(i, produtos)), total = totalVenda(venda.itens);
  if (total <= 0) return { ok: false, erros: ['O total da venda deve ser maior que zero.'] };
  if (!permitirNegativo && ovos > estoqueDisponivel(est.fisico, est.reservado)) return { ok: false, erros: ['Estoque disponível insuficiente para esta venda.'] };
  return { ok: true, ovos, total, reservar: ovos, lancamento: { tipo: 'receita', valor: total, origemId: venda.id, status: 'aberto' } };
}
function estornarVenda(venda, produtos, justificativa) {
  if (!justificativa) return { ok: false, erros: ['O estorno exige justificativa.'] };
  if (!['confirmada', 'expedida'].includes(venda.status)) return { ok: false, erros: ['Só vendas confirmadas ou expedidas podem ser estornadas.'] };
  const ovos = somar(venda.itens, i => ovosDoItem(i, produtos));
  return { ok: true, liberar: venda.status === 'confirmada' ? ovos : 0, devolver: venda.status === 'expedida' ? ovos : 0, anularLancamentoDe: venda.id, justificativa };
}

// ---- Financeiro ----
const totalPago = l => r2(somar(l.pagamentos || [], p => p.valor));
const emAberto = l => l.status === 'anulado' ? 0 : r2(l.valor - totalPago(l));
function registrarPagamento(l, valor) {
  if (!(valor > 0)) return { ok: false, erro: 'Informe um valor maior que zero.' };
  if (valor > emAberto(l) + 0.001) return { ok: false, erro: 'O pagamento excede o valor em aberto.' };
  return { ok: true, restante: r2(emAberto(l) - valor) };
}
function resumoFinanceiro(lancs) {
  const a = ativos(lancs), rec = a.filter(l => l.tipo === 'receita'), des = a.filter(l => l.tipo === 'despesa');
  const faturado = r2(somar(rec, l => l.valor)), incorridas = r2(somar(des, l => l.valor));
  return { faturado, recebido: r2(somar(rec, totalPago)), despesasIncorridas: incorridas, despesasPagas: r2(somar(des, totalPago)), resultadoOperacional: r2(faturado - incorridas) };
}

// Cliente mínimo da API do GitHub (Git Data API). O token fica só na closure e nunca entra em mensagens de erro.
class ErroGitHub extends Error { constructor(msg, status, tipo) { super(msg); this.status = status; this.tipo = tipo; } }
const decodificar = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));

function criarCliente({ token, owner, repo, branch = 'main', fetchFn = (...a) => fetch(...a) }) {
  const base = `https://api.github.com/repos/${owner}/${repo}`;
  async function req(metodo, url, corpo, extra = {}) {
    let r;
    try {
      r = await fetchFn(url, { method: metodo, cache: 'no-store', body: corpo ? JSON.stringify(corpo) : undefined,
        headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(corpo ? { 'Content-Type': 'application/json' } : {}), ...extra } });
    } catch { throw new ErroGitHub('Sem conexão com o GitHub. Verifique a internet e tente novamente.', 0, 'rede'); }
    if (r.status === 304) return { status: 304, r };
    if (r.ok) return { status: r.status, dados: await r.json(), r };
    const esgotado = r.status === 429 || (r.status === 403 && r.headers.get('x-ratelimit-remaining') === '0');
    const [msg, tipo] = r.status === 401 ? ['Token inválido ou expirado. Gere um novo token no GitHub.', 'auth']
      : esgotado ? ['Limite de requisições do GitHub atingido. Aguarde alguns minutos.', 'limite']
      : r.status === 403 ? ['O token não tem permissão para este repositório.', 'permissao']
      : r.status === 404 ? ['Repositório, branch ou arquivo não encontrado (ou o token não tem acesso).', 'naoencontrado']
      : r.status === 409 ? ['O repositório de dados está vazio. Crie-o com um arquivo README e tente novamente.', 'vazio']
      : [`O GitHub recusou a operação (código ${r.status}).`, 'outro'];
    throw new ErroGitHub(msg, r.status, tipo);
  }
  return {
    async verificar() {
      const u = (await req('GET', 'https://api.github.com/user')).dados, rp = (await req('GET', base)).dados;
      branch = rp.default_branch || branch;
      return { login: u.login, privado: !!rp.private, admin: !!rp.permissions?.admin, escrita: !!rp.permissions?.push };
    },
    async head(etag) {
      const x = await req('GET', `${base}/git/ref/heads/${branch}`, null, etag ? { 'If-None-Match': etag } : {});
      return x.status === 304 ? { mudou: false } : { mudou: true, sha: x.dados.object.sha, etag: x.r.headers.get('ETag') };
    },
    async ler(path, sha) {
      try { return JSON.parse(decodificar((await req('GET', `${base}/contents/${path}?ref=${sha}`)).dados.content)); }
      catch (e) { if (e.tipo === 'naoencontrado') return null; throw e; }
    },
    /** Um único commit com todos os arquivos. Falha com tipo 'conflito' se a branch avançou (sem force). */
    async commit(arquivos, mensagem, headSha) {
      const c = (await req('GET', `${base}/git/commits/${headSha}`)).dados;
      const t = (await req('POST', `${base}/git/trees`, { base_tree: c.tree.sha, tree: Object.entries(arquivos).map(([path, content]) => ({ path, mode: '100644', type: 'blob', content })) })).dados;
      const n = (await req('POST', `${base}/git/commits`, { message: mensagem, tree: t.sha, parents: [headSha] })).dados;
      try { await req('PATCH', `${base}/git/refs/heads/${branch}`, { sha: n.sha, force: false }); }
      catch (e) { if (e.status === 422) throw new ErroGitHub('Outro dispositivo gravou antes.', 422, 'conflito'); throw e; }
      return n.sha;
    }
  };
}

// Token do GitHub cifrado no aparelho (AES-GCM, chave derivada do PIN por PBKDF2). O token nunca é salvo em texto puro.
const KEY = 'ori.cred', ERR = 'ori.pinErros', ITER = 600000, MAX = 5;
const b64 = u => btoa(String.fromCharCode(...u)), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const validarPin = p => /^\d{4,6}$/.test(p);
async function derivar(pin, salt) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: ITER, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cifrar(token, pin) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await derivar(pin, salt), new TextEncoder().encode(token));
  return { v: 1, salt: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)) };
}
async function decifrar(reg, pin) {
  try { return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(reg.iv) }, await derivar(pin, unb64(reg.salt)), unb64(reg.ct))); } catch { return null; }
}
const temCredencial = (st = localStorage) => !!st.getItem(KEY);
async function salvarCredencial(token, pin, st = localStorage) { st.setItem(KEY, JSON.stringify(await cifrar(token, pin))); st.removeItem(ERR); }
const esquecer = (st = localStorage) => { st.removeItem(KEY); st.removeItem(ERR); };
async function desbloquear(pin, st = localStorage) {
  const raw = st.getItem(KEY);
  if (!raw) return { erro: 'Nenhuma credencial salva neste aparelho.' };
  const t = await decifrar(JSON.parse(raw), pin);
  if (t) { st.removeItem(ERR); return { token: t }; }
  const n = (+st.getItem(ERR) || 0) + 1;
  if (n >= MAX) { esquecer(st); return { erro: 'PIN errado 5 vezes. A credencial foi apagada deste aparelho; informe o token novamente.' }; }
  st.setItem(ERR, String(n)); return { erro: `PIN incorreto. Restam ${MAX - n} tentativas.` };
}


const VAZIO = () => ({ versaoEsquema: 1, registros: [] });
class ErroValidacao extends Error { constructor(erros) { super(erros.join(' ')); this.erros = erros; } }
const dataSP = d => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(d); // AAAA-MM-DD
const caminhoAuditoria = d => `data/auditoria/${dataSP(d).slice(0, 7)}.json`;

function criarRepositorio(cli, { usuario, agora = () => new Date(), pausa = ms => new Promise(r => setTimeout(r, ms)) }) {
  const s = { head: null, etag: null, arquivos: {}, leitura: null, gravacao: null, erro: null };
  const copia = o => JSON.parse(JSON.stringify(o));
  async function lerTodos(sha, paths) {
    const out = {};
    await Promise.all(paths.map(async p => {
      const f = (await cli.ler(p, sha)) || VAZIO();
      if (!Array.isArray(f.registros)) throw new Error(`O arquivo ${p} está corrompido. Restaure uma versão anterior pelo histórico do GitHub.`);
      out[p] = f;
    }));
    return out;
  }
  async function recarregar(paths = []) {
    const h = await cli.head();
    s.arquivos = await lerTodos(h.sha, [...new Set([...Object.keys(s.arquivos), ...paths])]);
    s.head = h.sha; s.etag = h.etag; s.leitura = agora(); s.erro = null;
  }
  return {
    estado: () => ({ head: s.head, leitura: s.leitura, gravacao: s.gravacao, erro: s.erro }),
    dados: p => s.arquivos[p], todos: () => copia(s.arquivos), marcarErro: m => { s.erro = m; },
    carregar: paths => recarregar([...paths, caminhoAuditoria(agora())]),
    async atualizar() {
      const h = await cli.head(s.etag), mudou = h.mudou && h.sha !== s.head;
      if (mudou) s.arquivos = await lerTodos(h.sha, Object.keys(s.arquivos));
      if (h.mudou) { s.head = h.sha; s.etag = h.etag; }
      s.leitura = agora(); s.erro = null; return mudou;
    },
    /** Lê o estado mais recente, aplica a operação, valida e grava tudo em um commit. Nada é dado como gravado antes da confirmação. */
    async transacao({ paths, opId, mensagem, aplicar, tentativas = 3 }) {
      let ultimo;
      for (let i = 0; i < tentativas; i++) {
        try {
          const ap = caminhoAuditoria(agora());
          await recarregar([...paths, ap]);
          if (Object.values(s.arquivos).some(f => jaProcessada(f.registros, opId))) return { ok: true, jaAplicada: true };
          const antes = copia(s.arquivos), dep = copia(s.arquivos), r = aplicar(dep) || {};
          if (r.erros?.length) throw new ErroValidacao(r.erros);
          dep[ap].registros.push({ id: novoId(), opId, em: agora().toISOString(), usuario, ...r.auditoria });
          const mud = {};
          for (const p of Object.keys(dep)) if (JSON.stringify(dep[p]) !== JSON.stringify(antes[p])) mud[p] = JSON.stringify(dep[p], null, 2) + '\n';
          const sha = await cli.commit(mud, `${mensagem} (por ${usuario})`, s.head);
          s.head = sha; s.etag = null; s.arquivos = dep; s.gravacao = agora(); s.erro = null;
          return { ok: true, sha };
        } catch (e) {
          if (e instanceof ErroValidacao) throw e;
          ultimo = e;
          if ((e.tipo === 'conflito' || e.tipo === 'rede') && i < tentativas - 1) { await pausa(300 * 2 ** i); continue; }
          break; // erros de autenticação, permissão, limite etc. não são repetidos
        }
      }
      if (ultimo.tipo === 'rede') ultimo.message += ' Se a falha ocorreu no envio, a gravação pode ter sido concluída: use Atualizar e confira antes de repetir.';
      s.erro = ultimo.message; throw ultimo;
    }
  };
}


const ARQ_GALPOES = 'data/galpoes.json';
const norm = s => String(s || '').trim().toLowerCase();
const txt = v => String(v ?? '').trim() || undefined;
const limpar = f => ({ codigo: String(f.codigo || '').trim(), nome: String(f.nome || '').trim(), capacidade: f.capacidade === '' || f.capacidade == null ? undefined : Number(f.capacidade),
  dataOperacao: txt(f.dataOperacao), situacao: f.situacao, linhagem: txt(f.linhagem), sistema: txt(f.sistema), observacoes: txt(f.observacoes) });
const erros = (g, lista) => [...validar('galpao', g), ...(ativos(lista).some(x => x.id !== g.id && norm(x.codigo) === norm(g.codigo)) ? ['Já existe um galpão com este código.'] : [])];
const achar = (dep, id) => ativos(dep[ARQ_GALPOES].registros).find(g => g.id === id);
const STALE = 'Este galpão foi alterado por outra pessoa. Feche e abra novamente para ver a versão atual.';

const opCriarGalpao = (form, usuario, agora, opId) => dep => {
  const rec = { id: novoId(), ...limpar(form), status: 'ativo', versao: 1, criadoEm: agora.toISOString(), criadoPor: usuario, atualizadoEm: agora.toISOString(), atualizadoPor: usuario, opId };
  const er = erros(rec, dep[ARQ_GALPOES].registros);
  if (er.length) return { erros: er };
  dep[ARQ_GALPOES].registros.push(rec);
  return { auditoria: { acao: 'criar', entidade: 'galpao', entidadeId: rec.id, depois: rec } };
};
const opEditarGalpao = (id, form, versaoEsperada, usuario, agora) => dep => {
  const g = achar(dep, id);
  if (!g) return { erros: ['Galpão não encontrado.'] };
  if (g.versao !== versaoEsperada) return { erros: [STALE] };
  const antes = { ...g };
  Object.assign(g, limpar(form), { versao: g.versao + 1, atualizadoEm: agora.toISOString(), atualizadoPor: usuario });
  const er = erros(g, dep[ARQ_GALPOES].registros);
  return er.length ? { erros: er } : { auditoria: { acao: 'editar', entidade: 'galpao', entidadeId: id, antes, depois: { ...g } } };
};
const opAnularGalpao = (id, justificativa, versaoEsperada, usuario, agora) => dep => {
  const g = achar(dep, id);
  if (!g) return { erros: ['Galpão não encontrado.'] };
  if (g.versao !== versaoEsperada) return { erros: [STALE] };
  if (String(justificativa || '').trim().length < 3) return { erros: ['Informe a justificativa da exclusão.'] };
  const antes = { ...g };
  Object.assign(g, { status: 'anulado', versao: g.versao + 1, atualizadoEm: agora.toISOString(), atualizadoPor: usuario });
  return { auditoria: { acao: 'anular', entidade: 'galpao', entidadeId: id, antes, depois: { ...g }, justificativa: justificativa.trim() } };
};

const rnd = (i, j) => { const x = Math.sin(i * 12.9898 + j * 78.233) * 43758.5453; return x - Math.floor(x); };

    ovos: Math.round(vivas * (0.84 + i * 0.015 + (rnd(d, i + 9) - .5) * .06)), racaoKg: Math.round(vivas * 0.112) });
});

const financeiro = Array.from({ length: DIAS }, (_, d) => ({
  data: iso(d), receita: Math.round(5200 + rnd(d, 3) * 1800), despesa: Math.round(3900 + rnd(d, 5) * 900) }));

function selecionar() {
  const datas = [...new Set(producao.map(p => p.data))].sort(), ult = datas.slice(-filtro.dias), ant = datas.slice(-2 * filtro.dias, -filtro.dias);

}

// ---------- Gráficos SVG simples ----------
function barras(vals, labels) {
  const W = 600, H = 200, m = 28, bw = (W - m) / vals.length, max = Math.max(...vals) || 1;
  return `<svg viewBox="0 0 ${W} ${H + 22}" role="img" aria-label="Produção diária de ovos">${vals.map((v, i) => { const h = v / max * H; return `<rect x="${m + i * bw + 2}" y="${H - h}" width="${bw - 4}" height="${h}" rx="2" fill="var(--g2)"><title>${labels[i]}: ${fmtNum(v)} ovos</title></rect>`; }).join('')}
  <text x="0" y="10">${fmtNum(max)}</text><text x="${m}" y="${H + 16}">${labels[0]}</text><text x="${W}" y="${H + 16}" text-anchor="end">${labels.at(-1)}</text></svg>`;
}
function linha(vals, labels) {
  const W = 600, H = 200, m = 34, v = vals.filter(x => x != null), lo = Math.floor(Math.min(...v) - 1), hi = Math.ceil(Math.max(...v) + 1);
  const pt = vals.map((x, i) => `${m + i * (W - m) / Math.max(vals.length - 1, 1)},${H - (x - lo) / (hi - lo) * H}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H + 22}" role="img" aria-label="Evolução da taxa de postura"><polyline points="${pt}" fill="none" stroke="var(--g2)" stroke-width="2.5"/>
  <text x="0" y="10">${hi}%</text><text x="0" y="${H}">${lo}%</text><text x="${m}" y="${H + 16}">${labels[0]}</text><text x="${W}" y="${H + 16}" text-anchor="end">${labels.at(-1)}</text></svg>`;
}
function comparacao(itens) {
  const lo = Math.min(...itens.map(i => i.v)) - 3, hi = Math.max(...itens.map(i => i.v));
  return `<svg viewBox="0 0 600 ${itens.length * 34}" role="img" aria-label="Taxa de postura por galpão">${itens.map((i, k) => `<text x="0" y="${k * 34 + 18}">${i.n}</text><rect x="80" y="${k * 34 + 5}" width="${(i.v - lo) / (hi - lo) * 420 + 20}" height="18" rx="2" fill="var(--g2)"/><text x="${(i.v - lo) / (hi - lo) * 420 + 106}" y="${k * 34 + 18}">${fmtPct(i.v)}</text>`).join('')}</svg>`;
}

  const todos = (REPO.dados(ARQ_GALPOES)?.registros || []).filter(g => g.status !== 'anulado');
  const q = galBusca.toLowerCase(), lista = todos.filter(g => `${g.codigo} ${g.nome}`.toLowerCase().includes(q)).sort((a, b) => a.codigo.localeCompare(b.codigo, 'pt-BR', { numeric: true }));
  const linhas = lista.map(g => `<tr><td>${esc(g.codigo)}</td><td>${esc(g.nome)}</td><td>${fmtNum(g.capacidade)}</td><td>${SIT[g.situacao] || esc(g.situacao)}</td><td>${esc(g.linhagem) || '—'}</td><td>${esc(g.sistema) || '—'}</td>
    <td>${SESSAO.escrita ? `<button class="btn sec" data-ed="${esc(g.id)}">Editar</button> <button class="btn sec" data-ex="${esc(g.id)}">Excluir</button>` : ''}</td></tr>`).join('');
  return `<h1>Galpões</h1><p class="sub">Dados gravados no GitHub e compartilhados entre todos os aparelhos.</p>
  <div class="filtros"><label class="f">Pesquisar<input id="gBusca" value="${esc(galBusca)}" placeholder="Código ou nome"></label>
  ${SESSAO.escrita ? '<button class="btn" id="gNovo">Novo galpão</button>' : '<span class="sub">Seu acesso é somente leitura.</span>'}</div>
  ${lista.length ? `<div class="tab"><table><thead><tr><th>Código</th><th>Nome</th><th>Capacidade (aves)</th><th>Situação</th><th>Linhagem</th><th>Sistema de criação</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>`
    : `<div class="vazio">${todos.length ? 'Nenhum galpão encontrado para esta pesquisa.' : 'Nenhum galpão cadastrado ainda. Use o botão Novo galpão para começar.'}</div>`}`;
}
function ligarGalpoes(m) {
  const reg = id => REPO.dados(ARQ_GALPOES).registros.find(g => g.id === id);
  m.querySelector('#gBusca').oninput = e => { galBusca = e.target.value; const p = e.target.selectionStart; rota(true); const n = $('#gBusca'); n.focus(); n.setSelectionRange(p, p); };
  m.querySelector('#gNovo')?.addEventListener('click', () => formGalpao());
  m.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => formGalpao(reg(b.dataset.ed)));
  m.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => excluirGalpao(reg(b.dataset.ex)));
}
async function gravar({ d, btn, rotulo, erroEl, op }) {
  btn.disabled = true; btn.textContent = 'Gravando…'; erroEl.textContent = '';
  try { await REPO.transacao(op); d.close(); aviso('Gravado e confirmado no GitHub.'); rota(true); badge(); }
  catch (e) { erroEl.textContent = e.erros ? e.erros.join(' ') : e.message; btn.disabled = false; btn.textContent = rotulo; badge(); }
}
function formGalpao(g) {
  const opId = novoId(), v = g || { situacao: 'ativo' };
  const d = dialogo(`<form class="frm"><h2>${g ? 'Editar' : 'Novo'} galpão</h2><div class="erros" role="alert"></div>
    <label class="f">Código<input name="codigo" required value="${esc(v.codigo)}"></label><label class="f">Nome<input name="nome" required value="${esc(v.nome)}"></label>
    <label class="f">Capacidade planejada (aves)<input name="capacidade" type="number" min="1" step="1" required value="${esc(v.capacidade)}"></label>
    <label class="f">Entrada em operação<input name="dataOperacao" type="date" value="${esc(v.dataOperacao)}"></label>
    <label class="f">Situação<select name="situacao">${Object.entries(SIT).map(([k, t]) => `<option value="${k}" ${v.situacao === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
    <label class="f">Linhagem das aves<input name="linhagem" value="${esc(v.linhagem)}"></label><label class="f">Sistema de criação<input name="sistema" value="${esc(v.sistema)}"></label>
    <label class="f">Observações<textarea name="observacoes" rows="2">${esc(v.observacoes)}</textarea></label>
    <div class="acoes"><button type="button" class="btn sec" data-fechar>Cancelar</button><button class="btn">Salvar galpão</button></div></form>`);
  const f = d.querySelector('form'), btn = f.querySelector('.btn:not(.sec)');
  f.onsubmit = ev => { ev.preventDefault(); const dados = Object.fromEntries(new FormData(f)), agora = new Date();
    gravar({ d, btn, rotulo: 'Salvar galpão', erroEl: f.querySelector('.erros'), op: { paths: [ARQ_GALPOES], opId, mensagem: `Galpão ${dados.codigo}: ${g ? 'editar' : 'criar'}`,
      aplicar: g ? opEditarGalpao(g.id, dados, g.versao, SESSAO.login, agora) : opCriarGalpao(dados, SESSAO.login, agora, opId) } }); };
}
function excluirGalpao(g) {
  const opId = novoId(), d = dialogo(`<form class="frm"><h2>Excluir galpão ${esc(g.codigo)}?</h2><p>O registro não é apagado: fica marcado como anulado no histórico, com a sua justificativa.</p><div class="erros" role="alert"></div>
    <label class="f">Justificativa<textarea name="j" rows="2" required></textarea></label><div class="acoes"><button type="button" class="btn sec" data-fechar>Cancelar</button><button class="btn perigo">Excluir galpão</button></div></form>`);
  const f = d.querySelector('form');
  f.onsubmit = ev => { ev.preventDefault(); gravar({ d, btn: f.querySelector('.perigo'), rotulo: 'Excluir galpão', erroEl: f.querySelector('.erros'),
    op: { paths: [ARQ_GALPOES], opId, mensagem: `Galpão ${g.codigo}: excluir`, aplicar: opAnularGalpao(g.id, f.j.value, g.versao, SESSAO.login, new Date()) } }); };
}

// ---------- Auditoria e configurações ----------
function paginaAuditoria() {
  const regs = [...(REPO.dados(caminhoAuditoria(new Date()))?.registros || [])].reverse();
  return `<h1>Auditoria e histórico</h1><p class="sub">Alterações do mês atual. O histórico completo também fica nos commits do repositório de dados.</p>
  ${regs.length ? `<div class="tab"><table><thead><tr><th>Data e hora</th><th>Usuário</th><th>Ação</th><th>Registro</th><th>Justificativa</th></tr></thead><tbody>${regs.map(r => `<tr><td>${esc(dataHora(r.em))}</td><td>${esc(r.usuario)}</td><td>${esc(r.acao)}</td><td>${esc(r.entidade)} ${esc(r.depois?.codigo || '')}</td><td>${esc(r.justificativa) || '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="vazio">Nenhuma alteração registrada neste mês.</div>'}`;
}
function paginaConfig() {
  const e = REPO.estado(), papel = SESSAO.admin ? 'administrador' : SESSAO.escrita ? 'lançamentos' : 'consulta';
  return `<h1>Configurações</h1><div class="card"><h2>Conexão</h2><p>Repositório de dados: <strong>${esc(CFG.owner)}/${esc(CFG.repo)}</strong> (privado)<br>Usuário: <strong>${esc(SESSAO.login)}</strong> · acesso de ${papel}<br>Última leitura: ${hora(e.leitura)} · Última gravação: ${hora(e.gravacao)}</p>
  <label class="f">Atualização automática<select id="cInt">${[[30, 'A cada 30 segundos'], [60, 'A cada 1 minuto'], [300, 'A cada 5 minutos'], [0, 'Somente manual']].map(([s, t]) => `<option value="${s}" ${+pref('ori.intervalo', 60) === s ? 'selected' : ''}>${t}</option>`).join('')}</select></label></div>
  <div class="card"><h2>Embalagens</h2><p>${CONFIG_PADRAO.ovosPorCartela} ovos por cartela e ${CONFIG_PADRAO.cartelasPorCaixa} cartelas por caixa (${CONFIG_PADRAO.ovosPorCartela * CONFIG_PADRAO.cartelasPorCaixa} ovos). Nesta versão o valor é fixo.</p></div>
  <div class="card"><h2>Backup e aparelho</h2><p>O histórico completo já fica guardado no GitHub. Você também pode baixar uma cópia dos dados carregados.</p><button class="btn sec" id="cBackup">Baixar backup (JSON)</button> <button class="btn sec" id="cEsq">Esquecer este aparelho</button></div>`;
}
function ligarConfig(m) {
  m.querySelector('#cInt').onchange = e => { try { localStorage.setItem('ori.intervalo', e.target.value); } catch {} agendar(); aviso('Intervalo atualizado.'); };
  m.querySelector('#cBackup').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(REPO.todos(), null, 2)], { type: 'application/json' })); a.download = `backup-ovos-rossi-${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(a.href); };
  m.querySelector('#cEsq').onclick = () => { if (confirm('Apagar o token salvo neste aparelho? Será preciso informá-lo de novo.')) { esquecer(); sair(); } };
}
Object.assign(PAGINAS, { galpoes: paginaGalpoes, auditoria: paginaAuditoria, configuracoes: paginaConfig });
Object.assign(LIGAR, { galpoes: ligarGalpoes, configuracoes: ligarConfig });

// ---------- Login e sessão ----------
function sair() { clearInterval(TIMER); SESSAO = REPO = null; location.hash = ''; mostrarLogin(); }
async function entrar(cli, info) {
  SESSAO = { login: info.login, escrita: info.escrita, admin: info.admin };
  REPO = criarRepositorio(cli, { usuario: info.login });
  await REPO.carregar([ARQ_GALPOES]);
  $('#login').hidden = true; $('.shell').hidden = false;
  $('#usuario').textContent = `${info.login} · ${info.admin ? 'administrador' : info.escrita ? 'lançamentos' : 'consulta'}`;
  badge(); agendar(); rota();
}
function mostrarLogin(msg = '') {
  $('.shell').hidden = true; const L = $('#login'); L.hidden = false; const tem = temCredencial();
  const pin = (n, t) => `<label class="f">${t}<input name="${n}" type="password" inputmode="numeric" autocomplete="off" maxlength="6" required></label>`;
  L.innerHTML = `<div class="lcard"><h1>Ovos Rossi Intelligence</h1><p class="sub">${tem ? 'Digite o seu PIN para entrar.' : 'Primeiro acesso neste aparelho.'}</p><div class="erros" role="alert">${esc(msg)}</div>
    <form id="lf">${tem ? pin('pin', 'PIN') : `<label class="f">Token de acesso do GitHub<input name="token" type="password" autocomplete="off" required></label>${pin('pin', 'Crie um PIN (4 a 6 números)')}${pin('pin2', 'Repita o PIN')}`}<button class="btn">Entrar</button></form>
    ${tem ? '<p><button class="link" id="esq">Usar outro token (esquecer este aparelho)</button></p>' : `<details><summary>Como criar o token?</summary><ol><li>No GitHub: Settings, Developer settings, Personal access tokens, Fine-grained tokens, Generate new token.</li><li>Em Repository access, escolha Only select repositories e marque <strong>${esc(CFG.repo)}</strong>.</li><li>Em Permissions, Repository permissions, defina <strong>Contents: Read and write</strong>.</li><li>Defina um prazo de expiração, gere e cole o token acima. Ele fica guardado cifrado com o seu PIN.</li></ol></details>`}</div>`;
  L.querySelector('#esq')?.addEventListener('click', () => { esquecer(); mostrarLogin(); });
  L.querySelector('#lf').onsubmit = async ev => {
    ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)), btn = ev.target.querySelector('.btn'), er = L.querySelector('.erros'); btn.disabled = true; btn.textContent = 'Verificando…'; er.textContent = '';
    try {
      let token;
      if (tem) { const r = await desbloquear(f.pin); if (r.erro) return mostrarLogin(r.erro); token = r.token; }
      else { if (!validarPin(f.pin)) throw new Error('O PIN deve ter de 4 a 6 números.'); if (f.pin !== f.pin2) throw new Error('Os PINs não conferem.'); token = f.token.trim(); }
      const cli = criarCliente({ token, owner: CFG.owner, repo: CFG.repo }), info = await cli.verificar();
      if (!info.privado) throw new Error('O repositório de dados é público. Torne-o privado nas configurações do GitHub antes de usar.');
      if (!tem) await salvarCredencial(token, f.pin);
      await entrar(cli, info);
    } catch (e) { er.textContent = e.message; btn.disabled = false; btn.textContent = 'Entrar'; }
  };
}
$('#sync').onclick = sincronizar; $('#sairBtn').onclick = sair;
document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(); });
if (!window.isSecureContext || !globalThis.crypto?.subtle) document.body.innerHTML = '<p style="padding:24px">Este endereço não oferece criptografia segura. Abra o sistema pelo endereço https do GitHub Pages.</p>';
else mostrarLogin();

</script>
