<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rossi Ovos</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4ee;--sf:#fff;--ink:#1d2a23;--mut:#66736b;--ln:#dde3d8;--ac:#e3a008;--on:#1d2a23;--gr:#2f6b4f;--rd:#b3412f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151b17;--sf:#1e2721;--ink:#eef2ea;--mut:#9aa89f;--ln:#2d3a32;--ac:#f0b429;--on:#151b17;--gr:#6cc49a;--rd:#ef8a77;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151b17;--sf:#1e2721;--ink:#eef2ea;--mut:#9aa89f;--ln:#2d3a32;--ac:#f0b429;--on:#151b17;--gr:#6cc49a;--rd:#ef8a77;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:16px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.br{display:flex;align-items:center;gap:12px}
.br img{border-radius:50%;flex:none;width:52px;height:52px}
h1{font-size:24px;font-weight:800;margin:0;line-height:1.1;white-space:nowrap}
h2{font-size:18px;margin:26px 0 10px}
#st{font-size:12px;color:var(--mut);text-align:right}
nav{display:flex;gap:4px;overflow-x:auto;margin:12px 0 18px;border-bottom:1px solid var(--ln)}
nav button{flex:none;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font:inherit;color:var(--mut);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-color:var(--ac)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gr);outline-offset:2px}
.hero{background:var(--ac);color:var(--on);padding:20px 18px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;border-radius:18px}
.hero b{font-size:clamp(52px,16vw,88px);font-weight:800;line-height:1}
.hero span{font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-top:14px;border-top:1px solid var(--ln)}
.k{padding:12px 4px;border-bottom:1px solid var(--ln)}
.k small{display:block;color:var(--mut);font-size:13px}
.k strong{font-size:22px;font-weight:600}
.neg{color:var(--rd)}.pos{color:var(--gr)}
.al{padding:10px 12px;border-left:4px solid var(--rd);background:var(--sf);margin:6px 0}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.bars i{flex:1;background:var(--gr);min-height:2px;border-radius:3px 3px 0 0}
#f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end;background:var(--sf);padding:14px;border:1px solid var(--ln);border-radius:12px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:4px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px;width:100%;min-width:0}
.pri{font:inherit;font-weight:600;background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:11px 14px;cursor:pointer}
.tw{overflow-x:auto;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mut);font-weight:400}
.lk{background:none;border:0;font:inherit;font-size:13px;color:var(--gr);cursor:pointer;padding:2px 6px}
.lk.arm{color:var(--rd);font-weight:600}
.em{color:var(--mut);padding:18px 0}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 24px}
.mb{display:flex;align-items:center;gap:4px;margin:0 0 14px}
.mb strong{min-width:170px;text-align:center;font-weight:600}
.mb .lk{font-size:24px;padding:0 14px;line-height:1.2}
#lg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:20px}
#lg.on{display:flex}
#lg form{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:22px;width:100%;max-width:360px;display:grid;gap:12px}
#lg h2{margin:0;font-size:19px}
#lg input{font:inherit;padding:11px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;box-sizing:border-box}
#lg button{font:inherit;font-weight:600;padding:12px;border:0;border-radius:8px;background:var(--ac);color:var(--on);cursor:pointer}
#lg .sec{background:transparent;color:var(--mut);border:1px solid var(--ln)}
#lgerr{color:var(--rd);font-size:14px;min-height:1.2em}
#so{margin-left:8px}
</style>
</head>

<script>
const CATS="Ração,Mão de obra,Energia,Medicamentos,Embalagem,Manutenção,Outros";
const SCH={
lotes:{t:"Lotes",f:[["nome","Nome do lote","text"],["linhagem","Linhagem","text"],["entrada","Data de alojamento","date"],["qtd","Aves alojadas","number"]]},
prod:{t:"Produção",f:[["data","Data","date"],["lote","Lote","lote"],["caixas","Caixas + cartelas","cx"],["quebrados","Quebrados/descartados","number"],["mort","Aves mortas","number"]]},
racao:{t:"Ração",f:[["data","Data","date"],["lote","Lote","lote"],["kg","Ração (kg)","number"],["custo","Custo (R$)","money"]]},
saude:{t:"Sanidade",f:[["data","Data","date"],["lote","Lote","lote"],["tipo","Tipo","sel:Vacina,Medicação,Vermífugo,Outro"],["descricao","Descrição","text"],["proxima","Próxima dose (opcional)","date"]]},
vendas:{t:"Vendas",f:[["data","Data","date"],["cliente","Cliente","text"],["caixas","Caixas + cartelas","cx"],["preco","Preço por caixa (R$)","money"],["pago","Pago?","sel:Sim,Não"]]},
despesas:{t:"Despesas",f:[["data","Data","date"],["cat","Categoria","sel:"+CATS],["descricao","Descrição","text"],["valor","Valor (R$)","money"]]}
};
const TABS=[["painel","Painel"],...Object.keys(SCH).map(k=>[k,SCH[k].t])];
const blank=()=>({lotes:[],prod:[],racao:[],saude:[],vendas:[],despesas:[]});
let S=blank(),tab="painel",edit=null,ref=null,timer=null,failed=false,selLote=null;
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>Number(v)||0;
const brl=v=>num(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const n0=v=>Math.round(num(v)).toLocaleString("pt-BR");
const tz=new Date().getTimezoneOffset()*60000;
const iso=d=>new Date(d.getTime()-tz).toISOString().slice(0,10);
const today=()=>iso(new Date());
let mes=today().slice(0,7);
const defDate=()=>mes===today().slice(0,7)?today():mes+"-01";
const mname=()=>{const[Y,M]=mes.split("-").map(Number);return new Date(Y,M-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"})};
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const br=s=>s?s.split("-").reverse().join("/"):"";
const sum=(a,k)=>a.reduce((t,x)=>t+num(x[k]),0);
const uid=()=>Math.random().toString(36).slice(2,10);
const lname=id=>(S.lotes.find(l=>l.id===id)||{}).nome||"—";

function alive(d){return S.lotes.filter(l=>l.entrada<=d).reduce((t,l)=>t+num(l.qtd)-sum(S.prod.filter(p=>p.lote===l.id&&p.data<=d),"mort"),0)}
const CART=12;
function pcx(s){s=String(s).trim().replace(/,/g,".").replace(/\s+/g,"");const m=s.match(/^(\d*\.?\d+)?(?:\+(\d*\.?\d+))?$/);if(!m||(m[1]==null&&m[2]==null))return null;return num(m[1])+num(m[2])/CART}
const eg=a=>a.reduce((t,p)=>t+(p.caixas!=null&&p.caixas!==""?num(p.caixas)*360:num(p.ovos)),0);
function pct(d){const a=alive(d);return a>0?eg(S.prod.filter(p=>p.data===d))/a*100:0}

function chartBars(){
  const[Y,M]=mes.split("-").map(Number),ms=[];
  for(let k=5;k>=0;k--){const d=new Date(Y,M-1-k,1),ym=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"),ds=[...new Set(S.prod.filter(p=>p.data.startsWith(ym)).map(p=>p.data))];
    ms.push({ym,lab:d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")+"/"+String(d.getFullYear()).slice(2),v:ds.length?ds.reduce((a,x)=>a+pct(x),0)/ds.length:null,n:ds.length})}
  if(!ms.some(m=>m.v!=null))return "";
  const W=420,H=230,L=38,R=10,T=18,B=26,iw=W-L-R,ih=H-T-B,bw=iw/6,y=v=>T+(1-v/100)*ih;
  const grid=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--ln)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" style="fill:var(--mut)" font-size="12">${v}%</text>`).join("");
  const bars=ms.map((m,i)=>{const cx=L+i*bw+bw/2,lb=`<text x="${cx}" y="${H-6}" text-anchor="middle" style="fill:var(--mut)" font-size="12">${m.lab}</text>`;
    if(m.v==null)return lb;
    return `<rect x="${cx-bw*.3}" y="${y(m.v)}" width="${bw*.6}" height="${T+ih-y(m.v)}" rx="3" style="fill:var(${m.ym===mes?"--ac":"--gr"})"><title>${m.lab}: ${m.v.toFixed(1)}% (${m.n} dias com registro)</title></rect><text x="${cx}" y="${y(m.v)-5}" text-anchor="middle" style="fill:var(--ink)" font-size="12">${m.v.toFixed(1)}</text>${lb}`}).join("");
  return `<h2>Postura média por mês</h2><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:560px;display:block" role="img" aria-label="Gráfico de barras com a postura média dos últimos 6 meses">${grid}${bars}</svg><p class="em" style="padding:6px 0">Mês selecionado em destaque. Média dos dias com registro.</p>`;
}
const nice=v=>{const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e};
const pf=v=>v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:3})+"%";
function chartMort(){
  const sel=`<h2>Mortalidade por lote</h2><label style="max-width:320px">Escolha o lote<select id="ls"><option value="">Selecione…</option>${S.lotes.map(l=>`<option value="${l.id}"${l.id===selLote?" selected":""}>${esc(l.nome)}</option>`).join("")}</select></label>`;
  const l=S.lotes.find(x=>x.id===selLote);
  if(!l)return sel+`<p class="em">${S.lotes.length?"Selecione um lote para ver o gráfico de mortalidade.":"Cadastre um lote para acompanhar a mortalidade."}</p>`;
  const q=num(l.qtd),ps=S.prod.filter(p=>p.lote===l.id),tot=sum(ps,"mort"),[Y,M]=mes.split("-").map(Number),n=new Date(Y,M,0).getDate(),pts=[];
  for(let i=1;i<=n;i++){const d=mes+"-"+String(i).padStart(2,"0"),rs=ps.filter(p=>p.data===d);if(!rs.length||d<l.entrada)continue;
    const vivas=q-sum(ps.filter(p=>p.data<d),"mort"),m=sum(rs,"mort");pts.push({i:i-1,d,m,v:vivas>0?m/vivas*100:0})}
  const antes=sum(ps.filter(p=>p.data<mes+"-01"),"mort"),mm=sum(ps.filter(p=>p.data.startsWith(mes)),"mort"),vm=q-antes;
  const kp=`<div class="grid"><div class="k"><small>Mortalidade total</small><strong>${q>0?pf(tot/q*100):"—"}</strong><small>${n0(tot)} de ${n0(q)} aves alojadas</small></div><div class="k"><small>Mortalidade em ${mname()}</small><strong>${vm>0?pf(mm/vm*100):"—"}</strong><small>${n0(mm)} aves no mês</small></div><div class="k"><small>Aves vivas</small><strong>${n0(q-tot)}</strong></div></div>`;
  let g;
  if(!pts.length)g=`<p class="em">Sem produção lançada para este lote em ${mname()}.</p>`;
  else{
    const mx=Math.max(...pts.map(p=>p.v)),top=mx>0?nice(mx):0.1,W=420,H=230,L=52,R=10,T=14,B=26,iw=W-L-R,ih=H-T-B,bw=iw/n,y=v=>T+(1-v/top)*ih;
    const grid=[0,.5,1].map(k=>{const v=top*k;return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--ln)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" style="fill:var(--mut)" font-size="12">${pf(v)}</text>`}).join("");
    const bars=pts.map(p=>`<rect x="${L+p.i*bw+bw*.15}" y="${y(p.v)}" width="${bw*.7}" height="${Math.max(p.v>0?1:0,T+ih-y(p.v))}" style="fill:var(--rd)"><title>${br(p.d)}: ${p.m} mortas (${pf(p.v)})</title></rect>`).join("");
    const xl=[0,Math.floor((n-1)/2),n-1].map(i=>`<text x="${L+i*bw+bw/2}" y="${H-6}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" style="fill:var(--mut)" font-size="12">${String(i+1).padStart(2,"0")}/${String(M).padStart(2,"0")}</text>`).join("");
    g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:560px;display:block" role="img" aria-label="Gráfico da porcentagem de aves mortas por dia">${grid}${bars}${xl}</svg><p class="em" style="padding:6px 0">Porcentagem de mortes por dia, sobre as aves vivas no início de cada dia.</p>`}
  return sel+mbar()+g+kp;
}
function mbar(){const s=mname();return `<div class="mb"><button class="lk" data-m="-1" aria-label="Mês anterior">‹</button><strong>${s.charAt(0).toUpperCase()+s.slice(1)}</strong><button class="lk" data-m="1" aria-label="Próximo mês">›</button></div>`}
function chart30(){
  const[Y,M]=mes.split("-").map(Number),n=new Date(Y,M,0).getDate(),ds=[];for(let i=1;i<=n;i++)ds.push(mes+"-"+String(i).padStart(2,"0"));
  const pts=ds.map((d,i)=>({d,i,v:pct(d),has:S.prod.some(p=>p.data===d)})).filter(x=>x.has);
  if(!pts.length)return "";
  const vs=pts.map(p=>p.v),W=420,H=230,L=38,R=10,T=12,B=26,iw=W-L-R,ih=H-T-B;
  let lo=Math.max(0,Math.floor((Math.min(...vs)-5)/10)*10),hi=Math.min(100,Math.ceil((Math.max(...vs)+5)/10)*10);
  if(hi-lo<20){if(hi>=100)lo=80;else hi=lo+20}
  if((hi-lo)%20){if(hi<100)hi+=10;else lo-=10}
  const x=i=>L+i/Math.max(1,n-1)*iw,y=v=>T+(1-(v-lo)/(hi-lo))*ih;
  const grid=[0,1,2,3,4].map(k=>{const v=lo+(hi-lo)*k/4;return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--ln)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" style="fill:var(--mut)" font-size="12">${Math.round(v)}%</text>`}).join("");
  const xl=[0,Math.floor((n-1)/2),n-1].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===0?"start":i===n-1?"end":"middle"}" style="fill:var(--mut)" font-size="12">${br(ds[i]).slice(0,5)}</text>`).join("");
  const line=pts.map(p=>`${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const dots=pts.map(p=>`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5" style="fill:var(--gr)"><title>${br(p.d)}: ${p.v.toFixed(1)}%</title></circle>`).join("");
  const avg=vs.reduce((a,b)=>a+b,0)/vs.length;
  return `<h2>Postura em ${mname()}</h2><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:560px;display:block" role="img" aria-label="Gráfico da porcentagem de postura em ${mname()}">${grid}${xl}<polyline points="${line}" fill="none" stroke-width="2.5" style="stroke:var(--gr)"/>${dots}</svg><p class="em" style="padding:6px 0">Média: ${avg.toFixed(1)}% em ${pts.length} dias com registro.</p>`;
}
function painel(){
  const hoje=today(),m=mes,[Y,M]=mes.split("-").map(Number),fim=mes===hoje.slice(0,7)?hoje:mes+"-"+String(new Date(Y,M,0).getDate()).padStart(2,"0"),t=fim;
  const days=[...new Set(S.prod.map(p=>p.data))].filter(d=>d<=fim).sort(),last=days.length&&days[days.length-1].startsWith(m)?days[days.length-1]:undefined;
  const rec=S.vendas.filter(v=>v.data.startsWith(m)).reduce((s,v)=>s+num(v.caixas)*num(v.preco),0);
  const desp=sum(S.despesas.filter(x=>x.data.startsWith(m)),"valor")+sum(S.racao.filter(x=>x.data.startsWith(m)),"custo");
  const bons=eg(S.prod.filter(p=>p.data.startsWith(m)))-sum(S.prod.filter(p=>p.data.startsWith(m)),"quebrados");
  const pf=S.prod.filter(p=>p.data<=fim),est=(eg(pf)-sum(pf,"quebrados"))/360-sum(S.vendas.filter(v=>v.data<=fim),"caixas");
  const aRec=S.vendas.filter(v=>v.pago==="Não").reduce((s,v)=>s+num(v.caixas)*num(v.preco),0);
  const av=alive(t),kg7=sum(S.racao.filter(r=>r.data>addDays(t,-7)&&r.data<=t),"kg");
  const al=[];
  if(last&&days.length>3){const prev=days.slice(-8,-1).map(pct),avg=prev.reduce((a,b)=>a+b,0)/prev.length;if(pct(last)<avg-3)al.push(`Postura de ${br(last)} (${pct(last).toFixed(1)}%) está abaixo da média dos dias anteriores (${avg.toFixed(1)}%).`)}
  if(est<0)al.push("O estoque calculado ficou negativo: confira vendas e produção lançadas.");
  S.saude.filter(s=>s.proxima&&s.proxima<=addDays(hoje,7)).sort((a,b)=>a.proxima<b.proxima?-1:1).forEach(s=>al.push(`${s.tipo} do lote ${esc(lname(s.lote))}: ${esc(s.descricao)} — ${s.proxima<hoje?"atrasada desde":"prevista para"} ${br(s.proxima)}.`));
  const ch=`<div class="cg"><div>${chart30()}</div><div>${chartBars()}</div></div>`;
  if(!S.lotes.length)return `<p class="em">Comece cadastrando seu primeiro lote na aba Lotes. Depois lance a produção todo dia e o painel se monta sozinho.</p>`;
  return `<div class="hero"><b>${last?pct(last).toFixed(1):"—"}%</b><span>postura ${last?"em "+br(last):"(sem produção lançada)"}<br>${n0(av)} aves vivas</span></div>
  <div class="grid">
  <div class="k"><small>Estoque</small><strong>${est.toLocaleString("pt-BR",{maximumFractionDigits:1})} caixas</strong></div>
  <div class="k"><small>Receita do mês</small><strong>${brl(rec)}</strong></div>
  <div class="k"><small>Despesas do mês</small><strong>${brl(desp)}</strong></div>
  <div class="k"><small>Resultado do mês</small><strong class="${rec-desp<0?"neg":"pos"}">${brl(rec-desp)}</strong></div>
  <div class="k"><small>Custo por caixa (mês)</small><strong>${bons>0?brl(desp/(bons/360)):"—"}</strong></div>
  <div class="k"><small>Ração (g/ave/dia, 7 dias)</small><strong>${av>0&&kg7?(kg7*1000/av/7).toFixed(0):"—"}</strong></div>
  <div class="k"><small>A receber</small><strong>${brl(aRec)}</strong></div>
  </div>
  ${al.length?`<h2>Alertas</h2>${al.map(a=>`<div class="al">${a}</div>`).join("")}`:""}
  ${ch}`;
}

function cell(f,r){const v=r[f[0]],ty=f[2];if(f[0]==="caixas"&&v==null&&r.ovos!=null)return (r.ovos/360).toLocaleString("pt-BR",{maximumFractionDigits:2});if(ty==="date")return br(v);if(ty==="cx"&&r.cxt)return esc(r.cxt);if(ty==="money")return v===""||v==null?"":brl(v);if(ty==="lote")return esc(lname(v));return esc(v)}
function view(){
  const sc=SCH[tab],lotesOk=S.lotes.length>0||tab==="lotes"||tab==="vendas"||tab==="despesas";
  const e=edit?S[tab].find(x=>x.id===edit):null;
  const inp=f=>{const[n,l,ty]=f,v=e?((ty==="cx"&&e.cxt)||(e[n]??"")):(ty==="date"&&n!=="proxima"?defDate():"");
    if(ty==="lote")return `<label>${l}<select name="${n}" required>${S.lotes.map(x=>`<option value="${x.id}"${x.id===v?" selected":""}>${esc(x.nome)}</option>`).join("")}</select></label>`;
    if(ty.startsWith("sel:"))return `<label>${l}<select name="${n}">${ty.slice(4).split(",").map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select></label>`;
    const req=n==="proxima"||n==="quebrados"||n==="mort"?"":" required";
    return `<label>${l}<input name="${n}" type="${ty==="date"?"date":ty==="text"||ty==="cx"?"text":"number"}" ${ty==="text"||ty==="date"?"":ty==="cx"?`placeholder="ex.: 22+7" autocomplete="off" `:`step="any" min="0" inputmode="decimal"`}value="${esc(v)}"${req}></label>`};
  const rows=S[tab].filter(r=>tab==="lotes"||(r.data||"").startsWith(mes)).sort((a,b)=>((b.data||b.entrada)>(a.data||a.entrada))?1:-1).slice(0,200);
  const extra=tab==="lotes";
  return `${lotesOk?`<div id="f">${sc.f.map(inp).join("")}<button class="pri" data-save="1">${e?"Salvar alterações":"Adicionar"}</button><span id="er" class="neg"></span></div>`:`<p class="em">Cadastre um lote antes de lançar registros desta aba.</p>`}
  <div class="tw">${rows.length?`<table><tr>${sc.f.map(f=>`<th>${f[1]}</th>`).join("")}${extra?"<th>Aves vivas</th><th>Semanas</th>":""}<th></th></tr>
  ${rows.map(r=>`<tr>${sc.f.map(f=>`<td>${cell(f,r)}</td>`).join("")}${extra?`<td>${n0(num(r.qtd)-sum(S.prod.filter(p=>p.lote===r.id),"mort"))}</td><td>${Math.max(0,Math.floor((new Date(today())-new Date(r.entrada))/6048e5))}</td>`:""}<td><button class="lk" data-ed="${r.id}">Editar</button><button class="lk" data-del="${r.id}">Excluir</button></td></tr>`).join("")}</table>`:`<p class="em">${tab==="lotes"?"Nenhum lote ainda.":"Nenhum registro neste mês."}</p>`}</div>`;
}

function render(){
  $("#nav").innerHTML=TABS.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${k===tab}">${l}</button>`).join("");
  $("#app").innerHTML=(tab==="lotes"?"":mbar())+(tab==="painel"?painel():view())+(tab==="lotes"?chartMort():"");
}
function status(t){$("#st").textContent=t}
function save(){
  S._u=Date.now();
  try{localStorage.setItem("granja:v1",JSON.stringify(S))}catch(e){}
  if(!ref){status("Salvo neste aparelho");return}
  status("Salvando…");clearTimeout(timer);
  timer=setTimeout(()=>{ref.set(S).then(()=>{failed=false;status(JSON.stringify(S).length>200000?"Sincronizado — dados perto do limite, avise para arquivar":"Sincronizado")}).catch(e=>{failed=true;status("Erro ao sincronizar ("+((e&&e.code)||String(e))+(e&&e.detail?": "+e.detail:"")+"); salvo neste aparelho")})},300);
}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button");if(!b)return;
  if(b.dataset.m){const[Y,M]=mes.split("-").map(Number),d=new Date(Y,M-1+Number(b.dataset.m),1);mes=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");edit=null;render();return}
  if(b.dataset.save){submitF();return}
  if(b.dataset.t){tab=b.dataset.t;edit=null;render();return}
  if(b.dataset.ed){edit=b.dataset.ed;render();scrollTo(0,0);return}
  if(b.dataset.del){
    if(!b.classList.contains("arm")){b.classList.add("arm");b.textContent="Confirmar?";return}
    S[tab]=S[tab].filter(x=>x.id!==b.dataset.del);edit=null;save();render();
  }
});
function submitF(){
  const box=$("#f"),o={};
  const bad=[...box.querySelectorAll("input,select")].find(x=>!x.checkValidity());
  if(bad){$("#er").textContent="Preencha: "+bad.closest("label").firstChild.textContent;bad.focus();return}
  for(const f of SCH[tab].f){const v=box.querySelector(`[name="${f[0]}"]`).value;
    if(f[2]==="cx"){const n=pcx(v);if(n==null){$("#er").textContent="Digite as caixas e as cartelas, como 22+7";return}o[f[0]]=n;o.cxt=v.trim()}
    else o[f[0]]=(f[2]==="number"||f[2]==="money")&&v!==""?Number(v):v}
  if(edit){S[tab]=S[tab].map(x=>x.id===edit?{...x,...o}:x);edit=null}else S[tab].push({id:uid(),...o});
  save();render();
}
document.addEventListener("change",ev=>{if(ev.target.id==="ls"){selLote=ev.target.value||null;render()}});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.closest&&ev.target.closest("#f")&&ev.target.tagName!=="BUTTON")submitF()});

try{const l=JSON.parse(localStorage.getItem("granja:v1")||"null");if(l)S={...blank(),...l}}catch(e){}
render();status("Salvo neste aparelho");
// ====== SINCRONIZAÇÃO (GitHub) ======
// Os dados ficam no arquivo granja.json de um repositório seu. Cada aparelho se conecta uma vez com um token.
(function(){
  const KEY="granja:gh",FILE="granja.json";
  const ov=$("#lg"),bt=$("#so"),er=$("#lgerr");
  let cfg=null,sha=null,poll=null,busy=false;
  try{cfg=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
  if(cfg){cfg.repo=String(cfg.repo||"").replace(/\s+/g,"");cfg.token=String(cfg.token||"").replace(/[^\x21-\x7e]/g,"")}
  const enc=s=>{let r="";new TextEncoder().encode(s).forEach(c=>r+=String.fromCharCode(c));return btoa(r)};
  const dec=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,"")),c=>c.charCodeAt(0)));
  const api=(method,body)=>fetch("https://api.github.com/repos/"+cfg.repo+"/contents/"+FILE+(method==="GET"?"?t="+Date.now():""),{method,headers:Object.assign({Authorization:"Bearer "+cfg.token},body?{"Content-Type":"application/json"}:{}),body:body?JSON.stringify(body):undefined});
  const fail=async r=>{const e=new Error("http");e.code=r.status;try{e.detail=(await r.json()).message}catch(x){}return e};
  const why=e=>{const d=e&&e.detail?" — "+e.detail:"";return e&&e.code===401?"token inválido ou expirado"+d:e&&e.code===403?"token sem permissão"+d:e&&e.code===404?"repositório não encontrado"+d:e&&e.code?"erro "+e.code+" do GitHub"+d:"sem conexão com o GitHub ("+((e&&e.message)||e)+")"};
  async function get(){
    const r=await api("GET");
    if(r.status===404){sha=null;return null}
    if(!r.ok)throw await fail(r);
    const j=await r.json();sha=j.sha;
    return JSON.parse(dec(j.content));
  }
  async function put(data){
    const body={message:"Atualização "+new Date().toISOString(),content:enc(JSON.stringify(data))};
    if(sha)body.sha=sha;
    let r=await api("PUT",body);
    if(r.status===409||r.status===422){await get();if(sha)body.sha=sha;else delete body.sha;r=await api("PUT",body)}
    if(!r.ok)throw await fail(r);
    sha=(await r.json()).content.sha;
  }
  async function pull(){
    if(!cfg||busy)return;
    busy=true;
    try{
      const d=await get();
      if(d){
        if(num(d._u)>num(S._u)){S={...blank(),...d};try{localStorage.setItem("granja:v1",JSON.stringify(S))}catch(e){}
          if(!/INPUT|SELECT/.test(document.activeElement.tagName))render()}
        else if(num(d._u)<num(S._u))save();
      }else if(S.lotes.length)save();
      if(!failed)status("Sincronizado");
    }catch(e){status("Sem sincronização: "+why(e)+"; salvo neste aparelho")}
    busy=false;
  }
  function on(){ref={set:put};bt.textContent="Desconectar";clearInterval(poll);poll=setInterval(pull,20000);pull()}
  function off(){cfg=null;sha=null;ref=null;clearInterval(poll);try{localStorage.removeItem(KEY)}catch(e){}bt.textContent="Conectar";status("Salvo neste aparelho")}
  bt.addEventListener("click",()=>{
    if(cfg){if(confirm("Desconectar este aparelho da sincronização? Os dados continuam salvos aqui e no GitHub."))off();return}
    er.textContent="";ov.classList.add("on");$("#lgr").focus();
  });
  $("#lgc").addEventListener("click",()=>ov.classList.remove("on"));
  $("#lgf").addEventListener("submit",async ev=>{
    ev.preventDefault();er.textContent="Testando…";
    const repo=$("#lgr").value.replace(/\s+/g,"").replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,"");
    cfg={repo,token:$("#lgt").value.replace(/[^\x21-\x7e]/g,"")};
    try{await get()}catch(e){
      let msg=why(e);
      if(!e.code){
        const t=cfg.token;let a=false,b=false;
        try{await fetch("https://api.github.com/zen",{cache:"no-store"});a=true}catch(x){}
        if(!a)msg="este aparelho não alcança api.github.com (rede, VPN, bloqueador de anúncios ou antivírus)";
        else{
          try{await fetch("https://api.github.com/user",{cache:"no-store",headers:{Authorization:"Bearer "+t}});b=true}catch(x){}
          let c=false;
          if(b){try{await fetch("https://api.github.com/repos/"+cfg.repo,{headers:{Authorization:"Bearer "+t}});c=true}catch(x){}}
          msg=!b?"o GitHub abre, mas o pedido com o token foi barrado (token com "+t.length+" caracteres); teste em aba anônima ou sem extensões":!c?"não consegui abrir o repositório \""+cfg.repo+"\"; confira se o nome está exatamente usuario/repositorio":"falha ao ler o arquivo de dados em \""+cfg.repo+"\" ("+((e&&e.message)||e)+")";
        }
      }
      cfg=null;er.textContent="Não deu certo: "+msg+".";return}
    try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}
    $("#lgt").value="";ov.classList.remove("on");on();
  });
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull()});
  addEventListener("online",pull);
  if(cfg)on();
})();
</script>
</body>
